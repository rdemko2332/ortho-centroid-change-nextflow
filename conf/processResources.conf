// Process CPU/memory requirements, expressed in portable Nextflow syntax (no bsub
// strings here) so this file works unchanged under any executor (LSF, Slurm, ...).
// Executor-specific submission flags belong in conf/lsf.config instead.
process {
    withName: 'classifyGroupsForRecompute' {
        cpus = 1
        memory = '2 GB'
    }
    withName: 'computeGroupCentroids' {
        // Not just the 130-140 SIGKILL range -- on at least one cluster this
        // runs on, LSF's own memory-limit kill (TERM_MEMLIMIT) surfaces as a
        // plain exit code 1, indistinguishable here from a real script
        // error. Retry any failure once with more memory before giving up;
        // a genuine bug fails identically on the retry and still ends in
        // 'finish', just one attempt later.
        errorStrategy = { task.attempt <= 2 ? 'retry' : 'finish' }
        maxRetries = 2
        cpus = 2
        memory = { task.attempt > 1 ? '32 GB' : '16 GB' }
    }
}
